name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    runs-on: sylphx-linux-standard
    steps:
      - uses: actions/checkout@v4
      - name: Enforce owned CI runner profiles
        run: python3 .github/scripts/check-owned-runner-profiles.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test
        run: cargo test
      - name: Clippy (residual informational)
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings
  ts:
    runs-on: sylphx-linux-standard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Test TS (residual informational)
        continue-on-error: true
        run: npm run test:ts
