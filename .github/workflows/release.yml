# Publish path for @sylphx/flux + @sylphx/flux-wasm (library digest bind).
# Fail-closed: pack integrity required; never continue-on-error for publish.
# Registry@0.1.0 was empty (wasm-pack .gitignore "*" blanked npm pack) — 0.1.1+ required.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    name: build-and-publish
    runs-on: sylphx-linux-standard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install JS deps
        run: npm install

      - name: Pack integrity (fail-closed)
        run: bash scripts/check-flux-pack-integrity.sh

      - name: Consumer smoke (local tarballs)
        run: bash scripts/check-flux-consumer-smoke.sh

      - name: Publish @sylphx/flux-wasm
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          VER="$(node -p "require('./packages/flux-wasm/package.json').version")"
          if npm view "@sylphx/flux-wasm@${VER}" version >/dev/null 2>&1; then
            echo "@sylphx/flux-wasm@${VER} already on registry — skip"
          else
            npm -w @sylphx/flux-wasm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @sylphx/flux
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          VER="$(node -p "require('./packages/flux/package.json').version")"
          if npm view "@sylphx/flux@${VER}" version >/dev/null 2>&1; then
            echo "@sylphx/flux@${VER} already on registry — skip"
          else
            npm -w @sylphx/flux publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Registry readback (fail-closed after publish attempt)
        run: |
          set -euo pipefail
          FLUX_VER="$(node -p "require('./packages/flux/package.json').version")"
          WASM_VER="$(node -p "require('./packages/flux-wasm/package.json').version")"
          npm view "@sylphx/flux@${FLUX_VER}" version gitHead dist.shasum --json
          npm view "@sylphx/flux-wasm@${WASM_VER}" version gitHead dist.shasum --json
          # Assert registry tarball is not package.json-only
          TMP="$(mktemp -d)"
          cd "$TMP"
          npm pack "@sylphx/flux-wasm@${WASM_VER}"
          tar -tzf "sylphx-flux-wasm-${WASM_VER}.tgz" | tee listing.txt
          grep -q 'package/wasm/flux_wasm_bg.wasm' listing.txt
          grep -q 'package/wasm/flux_wasm.js' listing.txt
          echo "registry pack integrity OK for @sylphx/flux-wasm@${WASM_VER}"
